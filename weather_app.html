<!DOCTYPE html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>
    <div class="info-box">
        <section>
            <div class="search">
                <input type="text" class="input-city" placeholder="Enter City Name">
            </div>
        </section>

        <section>
            <div class="weather">
                <h2 class="city">Weather in Siliguri</h2>
                <h3 class="temp">Temperature:21</h3>
                <img class="weather_icon>">
                <h4 class="description">Sunny</h4>
                <h4 class="humidity">Humidity:30</h4>
                <h4 class="wind">Wind Speed:10</h4>
            </div>
        </section>
    
    </div>

    <script src="script.js"></script>
</body>
